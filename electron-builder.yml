# Preserve the installed-app identity across the Signal Outpost rename.
appId: com.sdrextreme.desktop
productName: Signal Outpost
artifactName: Signal-Outpost-Setup-${version}-${arch}.${ext}
directories:
  output: dist
  buildResources: assets
# Workers, native DLLs and the receiver service need real filesystem paths.
asar: false
npmRebuild: false
afterPack: scripts/check-package.cjs
files:
  - desktop/**
  - lib/**
  - native/**
  - assets/**
  - server.mjs
  - app.js
  - app.css
  - theme.js
  - theme.css
  - theme-light.css
  - index.html
  - hd-radio-ui.js
  - kiwi-network.js
  - meshcore-ui.js
  - meshcore.css
  - propagation-ui.js
  - propagation.css
  - package.json
  - README.md
  - docs/meshcore-devices.md
  - docs/meshcore-repeaters.md
  - docs/meshcore-delivery.md
  - docs/propagation.md
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - '!**/local-data/**'
  - '!**/test/**'
  - '!**/scripts/**'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/256x256.png
  executableName: Signal Outpost
  # No signing certificate is supplied. HTTPS + SHA-512 still verify downloads.
  verifyUpdateCodeSignature: false
  # Keep the C++ runtime beside the Windows executable for native addon loads.
  extraFiles:
    - from: native/digital/win32-x64/bin
      to: .
      filter: [VCRUNTIME140.dll, VCRUNTIME140_1.dll, MSVCP140.dll]
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  icon: assets/256x256.png
  category: Utility
  executableName: signal-outpost
  artifactName: Signal-Outpost-${version}-${arch}.${ext}
  maintainer: KQ4ESZ
  desktop:
    entry:
      Comment: RTL-SDR receiver, scanner, and MeshCore companion client
      Categories: AudioVideo;Network;Utility;
mac:
  target: [dmg, zip]
  icon: assets/mac-app-icon.icns
  artifactName: Signal-Outpost-${version}-${arch}.${ext}
  category: public.app-category.utilities
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSBluetoothAlwaysUsageDescription: Signal Outpost uses Bluetooth to connect to MeshCore radios.
pacman:
  packageName: signal-outpost
  compression: zstd
  artifactName: Signal-Outpost-${version}-x86_64.pkg.tar.zst
  depends:
    - alsa-lib
    - at-spi2-core
    - c-ares
    - ffmpeg
    - gtk3
    - libevent
    - libnotify
    - libpulse
    - libsecret
    - libusb
    - libvpx
    - libxss
    - libxtst
    - libxslt
    - minizip
    - nss
    - re2
    - rtl-sdr
    - snappy
    - xdg-utils
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Signal Outpost
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  license: LICENSE
publish:
  provider: github
  owner: kq4esz
  repo: Signal-Outpost
  releaseType: release
  vPrefixedTagName: true
