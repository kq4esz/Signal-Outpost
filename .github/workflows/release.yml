name: Signal Outpost release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-outpost-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows installer
        run: pnpm build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Generate Windows checksums
        run: pnpm release:checksums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-files
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Linux native decoder build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git unzip \
            autoconf automake libtool patch libusb-1.0-0-dev libsndfile1-dev \
            libssl-dev libfftw3-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Linux desktop packages
        run: pnpm build:linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release-files
          path: dist/*
          if-no-files-found: error

  arch:
    runs-on: ubuntu-22.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch Linux native build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            alsa-lib autoconf automake at-spi2-core base-devel ca-certificates c-ares cmake fftw ffmpeg git gtk3 \
            libao libevent libnotify libpulse libsecret libsndfile libtool libusb libvpx libxss libxtst libxslt \
            libxcrypt-compat minizip nodejs npm nss openssl patch pkgconf ninja re2 rtl-sdr snappy unzip xdg-utils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Arch Linux package
        run: pnpm build:arch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-release-files
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  mac-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install macOS native build dependencies
        run: brew install autoconf automake cmake fftw libao libsndfile libtool libusb ninja pkg-config
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build macOS Intel packages
        run: pnpm build:mac:x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-x64-release-files
          path: |
            dist/Signal-Outpost-*-x64.dmg
            dist/Signal-Outpost-*-x64.zip
          if-no-files-found: error

  mac-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install macOS native build dependencies
        run: brew install autoconf automake cmake fftw libao libsndfile libtool libusb ninja pkg-config
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build macOS Apple silicon packages
        run: pnpm build:mac:arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-arm64-release-files
          path: |
            dist/Signal-Outpost-*-arm64.dmg
            dist/Signal-Outpost-*-arm64.zip
          if-no-files-found: error

  publish:
    runs-on: ubuntu-22.04
    needs: [windows, linux, arch, mac-x64, mac-arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-files
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-release-files
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arch-release-files
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mac-x64-release-files
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mac-arm64-release-files
          path: dist
      - name: Generate Linux checksums
        run: node scripts/release-checksums.mjs --linux
      - name: Generate macOS checksums
        run: node scripts/release-checksums.mjs --mac
      - name: Publish complete release
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
